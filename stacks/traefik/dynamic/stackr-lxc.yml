tcp:
  routers:
    stackr-lxc:
      rule: "HostSNIRegexp(`^(.+\\.)?stackr-lxc\\.vulpe\\.dev$`)"
      entryPoints:
        - websecure
      service: stackr-lxc
      tls:
        passthrough: true

  services:
    stackr-lxc:
      loadBalancer:
        servers:
          - address: "192.168.1.109:443"

http:
  routers:
    # plain-HTTP path: needed for stackr-lxc's Let's Encrypt http-challenge + its own redirects
    stackr-lxc-http:
      rule: "HostRegexp(`^(.+\\.)?stackr-lxc\\.vulpe\\.dev$`)"
      entryPoints:
        - web
      service: stackr-lxc-http

  services:
    stackr-lxc-http:
      loadBalancer:
        servers:
          - url: "http://192.168.1.109:80"
